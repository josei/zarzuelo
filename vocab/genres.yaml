  scope_note: El género chico es un género español de arte escénico y lírico. Es un
    subgénero de la zarzuela de formato breve típicamente en un acto, contrapuesto
    al género grande, que corresponde a obras de mayor duración.
- id: kb:genre:género-ínfimo
  pref_label: género ínfimo
  alt_labels: []
  scope_note: Paralelamente, se empieza a dar el apelativo de género ínfimo a las
    representaciones conocidas como revistas. Son obras musicales con conexión a algunas
    ideas de la zarzuela pero más ligeras y atrevidas, con números escénicos que,
    en la época se calificaron de «verdes», es decir, pícaros para los tiempos de
    hoy, que hablaban o ponían sobre la mesa la evolución de la sociedad sobre temas
    sexuales y con letras de doble intención, en casi todas hay «cuplés». Una de estas
    obras fue La corte de Faraón, basada en la opereta francesa Madame Putiphar. La
    música se hizo tan popular que algunos de sus números acabaron siendo verdaderos
    cuplés difundidos por el público.
  scope_source: https://es.wikipedia.org/w/index.php?title=Zarzuela&oldid=173361795
