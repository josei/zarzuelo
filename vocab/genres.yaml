  scope_note: Los juguetes cómicos, subgénero dentro del Género Chico, fueron piezas
    teatrales compuestas en un acto que solíanse representar en España durante el
    siglo XIX. Podían ser piezas exclusivamente dramáticas o lírico-dramáticas, en
    el caso de que se intercalaran canciones y bailes populares por aquella época
    (polkas, machichas, garrotín, etc.). Fueron muy populares en lo que se llamó Teatro
