- id: Q120031006
  pref_label: zarzuela grande
  alt_labels:
  - género grande
  scope_note: 'Después de la Revolución de 1868, el país entró en una profunda crisis
    (sobre todo económica) que se reflejó también en el teatro: el espectáculo teatral
    se convirtió en un entretenimiento caro, al alcance de pocos bolsillos. Fue entonces
    cuando el Teatro Variedades de Madrid tuvo la idea de reducir la duración de la
    representación, para abaratar el precio del espectáculo: la función teatral, que
    hasta entonces duraba unas cuatro horas, se redujo a una hora, lo que se llamó
    teatro por horas. La innovación tuvo un gran éxito y los compositores de zarzuelas
    se acomodaron al nuevo formato, creando obras mucho más cortas cuyo verdadero
    triunfo tardó diez años, hasta 1879. A las zarzuelas de un solo acto se las clasificó
    como género chico y a las de dos o más actos, género grande. La zarzuela grande
    se mantuvo en el Teatro de la Zarzuela de Madrid, aunque con poco éxito y poco
    público. A pesar de esto, en 1873 se abrió un nuevo teatro Apolo de Madrid, que
    compartió los fracasos con el anterior, por querer hacerle un lugar para el drama
    y la comedia, hasta que no tuvo más remedio que cambiar el espectáculo al género
    chico en el que triunfó durante decenios.'
  scope_source: https://es.wikipedia.org/w/index.php?title=Zarzuela&oldid=173361795
  broader:
  - Q148163
