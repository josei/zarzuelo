  - Genero operistico
  scope_note: El término ópera (del italiano òpera, "obras musicales") designa un
    género de música teatral en el que una acción escénica se armoniza, se canta y
    tiene acompañamiento instrumental. Las representaciones suelen ofrecerse en teatros
    de ópera, acompañadas por una orquesta o una agrupación musical menor. Forma parte
    de la tradición de la música clásica europea y occidental.
