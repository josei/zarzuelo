- id: Q170384
  pref_label: Opereta
  alt_labels:
  - Operetas
  - Operetta
  - Opérette
  scope_note: La opereta es un género musical derivado de la ópera que nace y se desarrolla
    a lo largo del siglo XIX, primero en París y después en Viena. Se trata de un
    tipo de ópera musical animado cuya característica fundamental consiste en contar
    con una trama inverosímil y disparatada. Consta de diálogos hablados, entre los
    que se intercalan historietas, llamadas Couplets por los franceses (Copla, en
    español dependiendo), y bailes como el rigodón o el cancán. Se trata, por lo tanto,
    de un espectáculo escénico con sucesión y alternancia de artes musicales, habladas
    y cantadas.​​​​​​​​​​
  scope_source: https://es.wikipedia.org/w/index.php?title=Opereta&oldid=174154671
  broader: []
- id: Q918727
  pref_label: Revista
  alt_labels:
  - Revista musical
  - Revista teatral
  - Revistas musicales
  - Revisteril
  - Teatro revisteril
  scope_note: 'Revista (en francés: revue) es un subgénero dramático de la comedia
    que se desenvuelve en un tipo de espectáculo que combina música, baile y, muchas
    veces, también breves escenas teatrales o sketches humorísticos o satíricos. La
    revista combina elementos dramáticos del burlesque, el vaudeville, la extravaganza
    y la comedia musical,​ pero se distingue de todos ellos anteriores por su carga
    erótica y simpleza dramática. Como en la opereta y el musical, la revista fusiona
    música, baile y textos en una función, aunque sin un hilo argumental. Gozó de
    especial popularidad a lo largo del siglo XX en Argentina, donde adquirió la forma
    de «revista porteña» y se convirtió en un icono cultural de la ciudad de Buenos
    Aires.'
  scope_source: https://es.wikipedia.org/w/index.php?title=Revista_(género)&oldid=175326455
  broader: []
