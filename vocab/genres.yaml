- id: Q3622181
  pref_label: tonadilla
  scope_source: https://es.wikipedia.org/w/index.php?title=Tonadilla&oldid=168039156
  alt_labels:
  - Tonadilla escénica
  - Tonadillas
  scope_note: Tonadilla es una canción tradicional española que tiene su origen en
    las jácaras del Siglo de Oro Español. Dichas jácaras eran canciones que se acompañaban
    con instrumentos y se interpretaban en los entreactos de una función de teatro,
    alternando con números de baile. La letra de las jácaras relataba en un lenguaje
    vulgar temas de la picaresca.​ Los intérpretes de este aire fueron llamados tonadilleros,
    nombre que heredaron luego las cupletistas del siglo XX. Famosas tonadilleras
    fueron Catalina Pacheco, María la Granadina y María Antonia Vallejo La Caramba.​
    Se conservan catalogadas dos mil tonadillas, muchas de ellas gracias al musicólogo
    José Subirá, principal estudioso del género.​ Entre los autores de las letras
    están los ilustres escritores don Ramón de la Cruz y Tomás de Iriarte.
- id: Q148163
  pref_label: zarzuela
  scope_source: https://es.wikipedia.org/w/index.php?title=Zarzuela&oldid=173361795
  alt_labels:
  - Género grande
  - Zarzuela grande
  - Zarzuelas
  scope_note: La zarzuela es una forma de música teatral o género musical escénico
    surgido en España que se distingue principalmente por contener partes instrumentales,
    partes vocales (solos, dúos, coros...) y partes habladas, aunque existen excepciones
    en las que estas últimas, las partes habladas, están completamente ausentes. El
    término «zarzuela», aplicado al género musical y teatral, procede del Palacio
    de la Zarzuela, palacio real español situado en las proximidades de Madrid y en
    el que se hallaba el teatro que albergó las primeras representaciones del género.
- id: Q121078178
  pref_label: zarzuela barroca
  alt_labels: []
  scope_note: La ambigüedad de tal clasificación, coincidente con clasificaciones
    de óperas italianas con fine tragico compuestas en la época, apunta a la probabilidad
    de que, en realidad, El Rodrigo sea la primera ópera mexicana. Tal especulación
    no se podrá solucionar hasta que la investigación avance al respecto. Sobre el
    estilo de ambas óperas solo caben conjeturas,ya que la música no se ha conservado;
    sin embargo, la familiaridad de Sumaya con libretos italianos y su contacto con
    el duque de Linares, un aficionado a la ópera italiana, parecen indicios suficientes
    para afirmar que, al menos La Parténope,se escribió en estilo italiano, superando
    el lenguaje de la zarzuela barroca presente en La Púrpura de la Rosa de Tomás
    de Torrejón (1701), sobre texto castellano de Calderón.
  scope_source: https://es.wikipedia.org/w/index.php?title=Manuel_de_Sumaya&oldid=174936945
  broader:
  - Q148163
