- subject: Julián Romea Parra
  type: person
  source: https://es.wikipedia.org/w/index.php?title=Julián_Romea_Parra&oldid=146774870
  passage: Nació en Zaragoza en 1848. Siendo hijo de los actores Mariano Romea Yanguas y Trinidad Parra Navarro. Además de
    su faceta de actor, destacó como comediógrafo de zarzuela y sainetes. Se formó con su tía Matilde Díez, realizando giras
    por América y España. Como libretista, pueden citarse La hija del Barba (1894), El padrino de el nene o todo por el arte
    (1896), El señor Joaquín (1898) y La tempranica (1900), estrenada en el Teatro de la Zarzuela de Madrid. En su faceta
    de compositor son reseñables la ya mencionada La hija del Barba, Niña Pancha (1886) y La segunda tiple (1890), estas dos
    últimas con partitura escrita en colaboración con Joaquín Valverde Durán.​
  candidatos:
  - property: birth_date
