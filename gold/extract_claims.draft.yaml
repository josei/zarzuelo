- subject: El Rajah
  type: work
  source: https://es.wikipedia.org/w/index.php?title=El_Rajah&oldid=165178046
  passage: Vásquez y yo no hemos creído mucho en los concursos, cuyo resultado está previsto o prefijado casi siempre. Nos
    animó, empero, la circunstancia de que, si no salíamos premiados, nuestra labor no sería estéril, pues llevaríamos la
    obra a la escena con elementos de la escuela. Alentados con esa perspectiva, escribimos la ópera Citlali -yo el verso
    y Vásquez la música- obteniendo el premio por unanimidad y representándose la obra, primero en el Teatro Iris, y después
    en El Toreo, durante la inolvidable temporada del tenor español, Miguel Fleta. Alentados por nuestro éxito escribimos
    y estrenamos después en diversas épocas, las óperas, El Mandarín, El Rajáh y El último sueño, el ballet azteca La Ofrenda;
    un poema sinfónico para orquesta y voces, y numerosos lieder...​
