- subject: El señor Joaquín
  type: work
  source: https://es.wikipedia.org/w/index.php?title=El_señor_Joaquín&oldid=157392374
  passage: Aunque en la actualidad es muy poco representada, esta zarzuela fue una de las más populares en su día, especialmente
    su alborada, con matices de alhambrismo, el estilo romántico que recrea los aires populares andaluces. Pablo Sorozábal
    la homenajeó mencionándola en La del manojo de rosas, cuando el protagonista, también llamado Joaquín, se nombra por vez
    primera. Tal vez su olvido se deba al tono lánguído, aunque no trágico, de la obra, con un final triste y abrupto.
