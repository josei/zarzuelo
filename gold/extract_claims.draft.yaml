- subject: Pío Baroja
  type: person
  source: https://es.wikipedia.org/w/index.php?title=Pío_Baroja&oldid=175632520
  passage: 'En 1900 publicó su primer libro, una recopilación de cuentos titulada Vidas sombrías,​ la mayoría compuestos en
    Cestona sobre gentes de esa región y sus propias experiencias como médico. En esta obra se encuentran en germen todas
    las obsesiones que reflejó en su novelística posterior. El libro fue muy leído y comentado por prestigiosos escritores
    como Miguel de Unamuno, quien se entusiasmó con él y quiso conocer al autor; por su amigo Azorín también y por Benito
    Pérez Galdós. Siempre negó la existencia de la «Generación del 98» por considerar que carecían sus pretendidos componentes
    de las necesarias afinidades y similitudes. En ese mismo año publica la que será su primera novela: La casa de Aizgorri,
    iniciando así su carrera como escritor y ensayista.​'
  candidatos: []
  faltan: []
- subject: María de la O Lejárraga
  type: person
  source: https://es.wikipedia.org/w/index.php?title=María_de_la_O_Lejárraga&oldid=173349276
  passage: Varias de estas obras tiene como eje un triángulo amoroso. Así Mujer (1925), La hora del diablo (1926) Triángulo
    (1929) y Sortilegio (1930) texto inédito que nunca se estrenó en España. Esta última es la única tragedia de la autora.
    Sorprende porque el triángulo está compuesto por un hombre y una mujer que compiten por el amor de otro hombre. Trata
    además del suicidio. Fue la última obra de María estrenada y firmada por Gregorio. En 1931 este se estableció en Hollywood
    con Catalina Bárcena y Lejárraga volvió a España (desde la Riviera francesa) donde colaboró activamente con la República
    y abandonó su producción dramática hasta el exilio.​
