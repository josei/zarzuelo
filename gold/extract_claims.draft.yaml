- subject: El cóndor pasa…
  type: work
  source: https://es.wikipedia.org/w/index.php?title=El_cóndor_pasa…&oldid=166197039
  passage: La única versión original de la zarzuela ha sido reconstruida y registrada en 2013 por la asociación Colectivo
    Cultural Centenario El Cóndor Pasa. Las piezas han sido escritas para orquesta y no para instrumentos andinos. Las partes
    más famosas como el preludio, el desfile y la cachua han sido cubiertas y adaptadas del arreglo de piano que Daniel Alomía
    Robles vendió a Edward B. Marks Music Corp. en 1933, en Nueva York. Estos están exentos de la cuota de cualquier pago
    de derechos de autor, debido al tiempo transcurrido. El pasacalle y la cachua han sido ampliamente grabados y difundidos,
    y en algunos casos se han añadido letras (todas ellas deben ser consideradas apócrifas) y generalmente se han cambiado
    sus ritmos e instrumentaciones.
  candidatos:
