[project]
name = "kb"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6", "pyyaml>=6", "typer>=0.12", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kb = "kb.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
