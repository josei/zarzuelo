# Alcance (plan §1 bis). Los géneros son conceptos del vocabulario; ampliar o recortar es configuración.
years: {from: 1650, to: 1960}
core:
  - zarzuela barroca
  - tonadilla escénica
  - ópera española
  - zarzuela grande
  - género chico
  - zarzuela del siglo XX
  - opereta española
